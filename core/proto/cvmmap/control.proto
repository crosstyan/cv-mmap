syntax = "proto3";
package cvmmap.proto;
option cc_enable_arenas = true;

enum SourceKind {
  SOURCE_KIND_UNKNOWN = 0;
  SOURCE_KIND_LIVE    = 1;
  SOURCE_KIND_FINITE  = 2;
}

enum TimestampDomain {
  TIMESTAMP_DOMAIN_UNKNOWN       = 0;
  TIMESTAMP_DOMAIN_UNIX_EPOCH_NS = 1;
  TIMESTAMP_DOMAIN_MEDIA_TIME_NS = 2;
}

enum RecordingFormat {
  RECORDING_FORMAT_UNKNOWN = 0;
  RECORDING_FORMAT_SVO     = 1;
  RECORDING_FORMAT_MCAP    = 2;
}

enum CameraControlSetting {
  CAMERA_CONTROL_SETTING_UNKNOWN                  = 0;
  CAMERA_CONTROL_SETTING_EXPOSURE                 = 1;
  CAMERA_CONTROL_SETTING_GAIN                     = 2;
  CAMERA_CONTROL_SETTING_AEC_AGC                  = 3;
  CAMERA_CONTROL_SETTING_WHITEBALANCE_TEMPERATURE = 4;
  CAMERA_CONTROL_SETTING_WHITEBALANCE_AUTO        = 5;
  CAMERA_CONTROL_SETTING_LED_STATUS               = 6;
  CAMERA_CONTROL_SETTING_EXPOSURE_TIME            = 7;
  CAMERA_CONTROL_SETTING_ANALOG_GAIN              = 8;
  CAMERA_CONTROL_SETTING_DIGITAL_GAIN             = 9;
  CAMERA_CONTROL_SETTING_AUTO_EXPOSURE_TIME_RANGE = 10;
  CAMERA_CONTROL_SETTING_AUTO_ANALOG_GAIN_RANGE   = 11;
  CAMERA_CONTROL_SETTING_AUTO_DIGITAL_GAIN_RANGE  = 12;
}

enum CameraControlValueKind {
  CAMERA_CONTROL_VALUE_KIND_UNKNOWN = 0;
  CAMERA_CONTROL_VALUE_KIND_SINGLE  = 1;
  CAMERA_CONTROL_VALUE_KIND_RANGE   = 2;
}

enum CameraControlWriteMode {
  CAMERA_CONTROL_WRITE_MODE_UNKNOWN = 0;
  CAMERA_CONTROL_WRITE_MODE_MANUAL  = 1;
  CAMERA_CONTROL_WRITE_MODE_AUTO    = 2;
}

enum ModuleStatusCode {
  MODULE_STATUS_CODE_UNKNOWN      = 0;
  MODULE_STATUS_CODE_ONLINE       = 1;
  MODULE_STATUS_CODE_OFFLINE      = 2;
  MODULE_STATUS_CODE_STREAM_RESET = 3;
}

enum ErrorCode {
  ERROR_CODE_OK              = 0;
  ERROR_CODE_UNKNOWN_CMD     = 1;
  ERROR_CODE_ERROR           = 2;
  ERROR_CODE_UNSUPPORTED     = 3;
  ERROR_CODE_INVALID_PAYLOAD = 4;
  ERROR_CODE_OUT_OF_RANGE    = 5;
  ERROR_CODE_TIMEOUT         = 6;
}

// -- ResetFrameCount --
message ResetFrameCountRequest {}
message ResetFrameCountResponse { ErrorCode error = 1; }

// -- GetSourceInfo --
message GetSourceInfoRequest {}
message GetSourceInfoResponse {
  ErrorCode        error              = 1;
  SourceKind       source_kind        = 2;
  TimestampDomain  timestamp_domain   = 3;
  uint32           flags              = 4;
  uint64           timeline_start_ns  = 5;
  uint64           timeline_end_ns    = 6;
  uint64           duration_ns        = 7;
  uint64           current_timestamp_ns = 8;
  uint32           current_frame_count  = 9;
}


// -- Playlist --
message PlaylistInfo {
  bool             has_playlist           = 1;
  repeated string  paths                  = 2;
  bool             sort_by_recording_time = 3;
  uint32           current_index          = 4;
  string           current_path           = 5;
}

message ApplyPlaylistRequest {
  repeated string paths                  = 1;
  bool            sort_by_recording_time = 2;
}

message ApplyPlaylistResponse {
  ErrorCode    error         = 1;
  PlaylistInfo playlist_info = 2;
  string       error_message = 3;
}

message GetPlaylistInfoRequest {}

message GetPlaylistInfoResponse {
  ErrorCode    error         = 1;
  PlaylistInfo playlist_info = 2;
  string       error_message = 3;
}

// -- Capabilities --
message CapabilitiesRequest {}
message CapabilitiesResponse {
  ErrorCode error = 1;
  repeated RecordingFormat available_recording_formats = 2;
}

// -- Camera Control --
message GetCameraControlCapabilitiesRequest {}
message GetCameraControlCapabilitiesResponse {
  ErrorCode               error              = 1;
  bool                    supported          = 2;
  repeated CameraControlSetting supported_settings = 3;
  string                  error_message      = 4;
}

message CameraControlState {
  CameraControlSetting   setting   = 1;
  CameraControlValueKind kind      = 2;
  sint32                 value     = 3;
  sint32                 min_value = 4;
  sint32                 max_value = 5;
}

message GetCameraControlRequest {
  CameraControlSetting setting = 1;
}

message GetCameraControlResponse {
  ErrorCode          error         = 1;
  CameraControlState control       = 2;
  string             error_message = 3;
}

message SetCameraControlRequest {
  CameraControlSetting   setting = 1;
  CameraControlWriteMode mode    = 2;
  sint32                 value   = 3;
}

message SetCameraControlResponse {
  ErrorCode          error         = 1;
  CameraControlState control       = 2;
  string             error_message = 3;
}

message SetCameraControlRangeRequest {
  CameraControlSetting setting   = 1;
  sint32               min_value = 2;
  sint32               max_value = 3;
}

message SetCameraControlRangeResponse {
  ErrorCode          error         = 1;
  CameraControlState control       = 2;
  string             error_message = 3;
}


// -- Recording --
message SvoRecordingOptions {
  optional string compression_mode          = 1;
  optional uint32 bitrate                   = 2;
  optional uint32 target_framerate          = 3;
  optional bool   transcode_streaming_input = 4;
}

message McapRecordingOptions {
  optional string compression = 1;
  optional string topic       = 2;
  optional string depth_topic = 3;
  optional string body_topic  = 4;
  optional string frame_id    = 5;
}

message RecordingStartRequest {
  string               output_path  = 1;
  SvoRecordingOptions  svo_options  = 10;
  McapRecordingOptions mcap_options = 11;
}

message RecordingStopRequest {}
message RecordingStatusRequest {}

message RecordingStatusResponse {
  ErrorCode       error           = 1;
  RecordingFormat format          = 2;
  bool            can_record      = 3;
  bool            is_recording    = 4;
  bool            is_paused       = 5;
  bool            last_frame_ok   = 6;
  uint32          frames_ingested = 7;
  uint32          frames_encoded  = 8;
  string          active_path     = 9;
  string          error_message   = 10;
}

// -- Module Status (pub/sub) --
message ModuleStatusEvent {
  ModuleStatusCode status       = 1;
  string           instance     = 2;
  uint64           timestamp_ns = 3;
}

// -- NATS Micro service discovery JSON payloads --
message NatsMicroPingResponse {
  string name    = 1;
  string version = 2;
  string id      = 3;
  string type    = 4;
}

message NatsMicroEndpointInfo {
  string name                 = 1;
  map<string, string> metadata = 2;
  string queue_group          = 3;
  string subject              = 4;
}

message NatsMicroInfoResponse {
  string description                    = 1;
  repeated NatsMicroEndpointInfo endpoints = 2;
  string id                             = 3;
  map<string, string> metadata          = 4;
  string name                           = 5;
  string type                           = 6;
  string version                        = 7;
}
