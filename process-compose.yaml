      restart: on_failure
      backoff_seconds: 2
  zed4:
    namespace: cameras
    description: cv-mmap producer for config_zed_4.toml
    command: "${CVMMAP_BIN:-./build/cv-mmap} --config config_zed_4.toml"
    working_dir: .
