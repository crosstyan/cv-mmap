[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cvmmap"
version = "0.1.0"
description = "cv-mmap client library"
requires-python = ">=3.10"
dependencies = [
    "anyio>=4.12.1",
    "click>=8.3.1",
    "loguru>=0.7.3",
    "numpy",
    "opencv-python>=4.13.0.92",
    "pyzmq",
]

[tool.hatch.build.targets.wheel]
packages = ["cvmmap"]
