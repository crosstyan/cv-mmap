# instance name
# no longer need declare shm_name and zmq_addr
# convention over configuration
# shm_name: cvmmap_{name}
# zmq_addr: ipc:///tmp/{shm_name}
name = 'example'
[video]
backend = 'gstreamer'
use_finite_as_infinite_stream = false
finite_stream_ending_behavior = 'loop' # stop | loop
[opencv]
parameter = "example.mkv"

[zed]
stream_mode = "local" # local|usb|device|auto or network aliases ethernet|network|stream
# network mode example:
# stream_mode = "ethernet"
# ip_address = "192.168.1.100"
# port = 30000
# serial = 12345
# index = 0
resolution = "1080p"
fps = 30
depth_mode = "neural"
open_timeout_ms = 10000
warmup_frames = 15
max_consecutive_failures = 30
reconnect_interval_ms = 1000
reconnect = true
left_pixel_format = "bgr8"
[gstreamer]
pipeline = "filesrc location=example.mkv ! decodebin ! videoconvert ! appsink name=sink"
